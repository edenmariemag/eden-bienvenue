
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent !important;
}

/* CONTENEUR DU GIF */

.scene {
  position: relative;
  width: 100%;
  height: 100%;
  background: transparent !important;
  box-shadow: none !important;
}

/* ANIMATION AIRDROP */

.scene img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;

  background: transparent !important;
  box-shadow: none !important;
  border: none;
}

/* BOUTONS INVISIBLES */

.scene button {
  position: absolute;
  bottom: 5%;
  height: 11.5%;

  padding: 0;
  border: none;
  background: transparent;

  color: transparent;
  font-size: 0;
  cursor: pointer;
}

.scene button:focus-visible {
  outline: 3px solid #298fff;
  outline-offset: -3px;
  border-radius: 8px;
}

/* OK */

.ok {
  left: 0;
  width: 41.1%;
}

/* J'ACCEPTE */

.accept {
  left: 41.1%;
  width: 41.1%;
}
</style>
</head>

<body>

<div class="scene">

  <img
    src="bienvenue.gif"
    alt="Bienvenue sur mon bureau !"
  >

  <button
    class="ok"
    aria-label="OK"
    onclick="closeWelcome()">
    OK
  </button>

  <button
    class="accept"
    aria-label="J'accepte"
    onclick="closeWelcome()">
    J'accepte
  </button>

</div>

<script>
function closeWelcome() {
  window.parent.postMessage(
    { type: "EDEN_CLOSE_WELCOME" },
    "*"
  );
}
</script>

</body>
</html>
