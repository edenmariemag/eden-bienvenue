<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bienvenue sur mon bureau — Eden</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { display: grid; place-items: center; }
  .scene { position: relative; width: min(100vw, calc(100vh * 1638 / 2048)); aspect-ratio: 1638 / 2048; transform-origin: center; animation: pop .48s cubic-bezier(.2,1.2,.3,1) both; }
  .scene img { position: absolute; display: block; height: auto; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  .airdrop { width: 100%; inset: 0 auto auto 0; z-index: 1; }
  /* Placement du GIF au-dessus de la fenêtre AirDrop. */
  .personnage { width: 73%; top: 17%; left: 6%; z-index: 2; }
  .action { position: absolute; z-index: 3; bottom: 5.1%; height: 11.3%; border: 0; background: transparent; cursor: pointer; }
  .action:focus-visible { outline: 3px solid #278bff; outline-offset: -3px; border-radius: 8px; }
  .ok { left: 0; width: 27.6%; }
  .accept { left: 27.6%; width: 55.2%; }
  @keyframes pop { from { opacity: 0; transform: scale(.88) translateY(16px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes vanish { to { opacity: 0; transform: scale(.94) translateY(10px); } }
  .scene.closing { animation: vanish .23s ease forwards; }
  @media (prefers-reduced-motion: reduce) { .scene, .scene.closing { animation-duration: .01ms; } }
</style>
</head>
<body>
<main class="scene" id="scene" aria-label="Message de bienvenue d'Eden">
  <img class="airdrop" src="airdrop.png" alt="AirDrop : Eden veut vous souhaiter la bienvenue. Hello ! Bienvenue sur mon bureau !">
  <img class="personnage" src="personnage.gif" alt="Dessin animé d'Eden qui salue">
  <button class="action ok" aria-label="OK, fermer la notification" type="button"></button>
  <button class="action accept" aria-label="J'accepte, fermer la notification" type="button"></button>
</main>
<script>
(function () {
  const scene = document.getElementById('scene');
  let closing = false;
  function closeWelcome() {
    if (closing) return;
    closing = true;
    scene.classList.add('closing');
    setTimeout(function () {
      window.parent.postMessage({ type: 'EDEN_CLOSE_WELCOME' }, '*');
      // En affichage autonome, masque également la notification.
      scene.hidden = true;
      scene.style.display = 'none';
    }, 240);
  }
  document.querySelectorAll('.action').forEach(button => button.addEventListener('click', closeWelcome));
})();
</script>
</body>
</html>
